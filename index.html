const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c9e8);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, .1, 350);

try {

sun.position.set(-18,30,12); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;
scene.add(sun);

const mat=(color,roughness=.82,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const grass=mat(0x6e9a66), asphalt=mat(0x404b58), sidewalk=mat(0xc4c3b8), sand=mat(0xe5cf91), ocean=mat(0x3eabc4,.3), white=mat(0xf3f4f6), dark=mat(0x263449), skin=mat(0xd99c73), shirt=mat(0x06b6d4), pants=mat(0x263b65), red=mat(0xe04f5f), yellow=mat(0xf5c451);
function box(parent,x,y,z,w,h,d,material,cast=true,receive=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=receive;parent.add(m);return m;}
function cylinder(parent,x,y,z,rt,rb,h,material,segments=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;}

// Ground and beach-side city block
box(scene,0,-.22,0,180,.4,180,grass,false,true);
box(scene,0,-.01,16,44,.12,76,asphalt,false,true);
box(scene,0,.02,16,1.1,.03,76,yellow,false,false);
box(scene,-8,.02,16,.12,.03,76,white,false,false);
box(scene,8,.02,16,.12,.03,76,white,false,false);
box(scene,0,-.05,-41,180,.25,22,sand,false,true);
box(scene,0,-.08,-55,180,.3,16,ocean,false,true);
for(let i=0;i<12;i++){const z=-32+i*6;box(scene,0,.04,z,42,.08,.12,white,false,false);}
// city sidewalks
box(scene,-11,.05,16,3,.18,76,sidewalk,false,true);box(scene,11,.05,16,3,.18,76,sidewalk,false,true);
function palm(x,z,s=1){
 const trunk=cylinder(scene,x,1.8*s,z,.18*s,.28*s,3.6*s,mat(0x8d6946),8);
 for(let i=0;i<6;i++){let a=i*Math.PI/3;let leaf=box(scene,x+Math.cos(a)*1.1*s,3.55*s,z+Math.sin(a)*1.1*s,2.2*s,.13*s,.42*s,mat(0x27734a));leaf.rotation.y=-a;leaf.rotation.z=Math.cos(a)*-.25;leaf.rotation.x=Math.sin(a)*.25;}
 sphere(scene,x,3.6*s,z,.28*s,mat(0x3a814b),10);
}
for(let z=-17;z<49;z+=9){palm(-13,z,.9);palm(13,z,.9);}
function building(x,z,w,d,h,color,label){
 const g=new THREE.Group();scene.add(g);
 box(g,x,h/2,z,w,h,d,mat(color),true,true);
 box(g,x,h+.12,z,w+.35,.24,d+.35,mat(0x374151),true,true);
 for(let yy=1.5;yy<h-1;yy+=2.2) for(let xx=-w/2+1;xx<w/2-.3;xx+=1.8){
  box(g,x+xx,yy,z-d/2-.012,1,.9,.035,mat(0x83cde3,.28,.1),false,false);
 }
 box(g,x,h*.48,z+d/2+.03,w*.42,h*.78,.08,mat(0x29394c),false,false);
 const sign=box(g,x,h*.75,z+d/2+.09,w*.66,.65,.12,mat(color===0xd9a66f?0x0f766e:0x7c3aed),false,false);
 return g;
}
building(-20,4,11,13,13,0xd9a66f,'HOTEL');building(20,7,10,13,18,0x7d8fb1,'CLUB');
building(-20,25,12,13,10,0xb5b7b9,'GYM');building(20,29,10,12,12,0xdca9a0,'SHOP');
building(-20,-15,12,12,8,0x9cb7a1,'CAFE');building(20,-13,11,12,9,0xb7a4cf,'APARTMENTS');
// Interactive destinations across the starter district
const destinations=[
 {name:'ÉPICERIE',x:-20,z:-15,type:'grocery',desc:'Boissons et nourriture pour récupérer de l’énergie.'},
 {name:'BOUTIQUE DE VÊTEMENTS',x:20,z:29,type:'clothes',desc:'Change de style avec des tenues originales.'},
 {name:'ARMURERIE FICTIVE',x:-20,z:4,type:'gear',desc:'Équipement de jeu non réaliste et objets de combat fictifs.'},
 {name:'CLUB DE NUIT',x:20,z:7,type:'club',desc:'Un lieu nocturne réservé aux personnages adultes.'},
 {name:'SALLE DE SPORT',x:-20,z:25,type:'gym',desc:'Entraîne-toi et prépare-toi aux combats.'},
 {name:'CAFÉ',x:-20,z:-15,type:'cafe',desc:'Fais une pause et rencontre les habitants.'},
 {name:'PLAGE',x:0,z:-40,type:'beach',desc:'Détends-toi au bord de l’océan.'}
];
let cash=250;

// Gym / wrestling ring in nearby park
box(scene,-2,.1,35,12,.2,10,mat(0x8b9d78),false,true);
box(scene,-2,.55,35,6,.7,4,mat(0x1d293c),true,true);
box(scene,-2,.95,35,5.5,.15,3.5,mat(0xe8e5dc),false,true);
for(let y of [1.15,1.65,2.15]){box(scene,-2,y,33.1,6,.07,.07,red,false,false);box(scene,-2,y,36.9,6,.07,.07,red,false,false);box(scene,-4.95,y,35,.07,.07,3.8,red,false,false);box(scene,.95,y,35,.07,.07,3.8,red,false,false);}
// Street lamps
for(let z=-13;z<45;z+=12){for(let x of [-10.5,10.5]){cylinder(scene,x,2.2,z,.07,.09,4.4,dark,8);box(scene,x,4.4,z,.7,.15,.35,yellow,false,false);}}

// Character factory: intentionally stylized, original shapes
function makeCharacter(isPlayer=false, outfit='blue'){
 const g=new THREE.Group();scene.add(g);
 const shirtMat=outfit==='red'?red:(outfit==='green'?mat(0x3b9b73):shirt);
 const body=box(g,0,1.32,0,.78,.92,.42,shirtMat);body.userData.part='body';
 const neck=cylinder(g,0,1.88,0,.12,.13,.22,skin,10);
 const head=sphere(g,0,2.15,0,.34,skin,16);
 const hair=sphere(g,0,2.36,-.035,.35,mat(outfit==='red'?0x30252a:0x4b3023),14);hair.scale.set(1,.48,1);
 sphere(g,-.12,2.16,.29,.045,white,8);sphere(g,.12,2.16,.29,.045,white,8);
 sphere(g,-.12,2.16,.326,.021,dark,8);sphere(g,.12,2.16,.326,.021,dark,8);
 box(g,0,2.02,.32,.12,.045,.04,mat(0x874b3c),false,false);
 const armL=new THREE.Group();armL.position.set(-.48,1.62,0);g.add(armL);
 cylinder(armL,0,-.28,0,.12,.14,.58,skin,10).rotation.z=-.15;
 sphere(armL,0,-.59,.02,.14,skin,10);
 const armR=new THREE.Group();armR.position.set(.48,1.62,0);g.add(armR);
 cylinder(armR,0,-.28,0,.12,.14,.58,skin,10).rotation.z=.15;
 sphere(armR,0,-.59,.02,.14,skin,10);
 const legL=new THREE.Group();legL.position.set(-.22,.92,0);g.add(legL);
 cylinder(legL,0,-.35,0,.15,.13,.7,pants,10);box(legL,0,-.72,.08,.28,.16,.42,dark);
 const legR=new THREE.Group();legR.position.set(.22,.92,0);g.add(legR);
 cylinder(legR,0,-.35,0,.15,.13,.7,pants,10);box(legR,0,-.72,.08,.28,.16,.42,dark);
 g.userData={body,head,armL,armR,legL,legR,health:100,isPlayer,walk:0,attack:0,stun:0};
 return g;
}
const player=makeCharacter(true,'blue');player.position.set(0,0,9);
const enemy=makeCharacter(false,'red');enemy.position.set(2.7,0,3);enemy.rotation.y=Math.PI;
const buddy=makeCharacter(false,'green');buddy.position.set(-5,0,18);buddy.scale.setScalar(.92);
const friend=makeCharacter(false,'red');friend.position.set(5,0,-4);friend.scale.setScalar(.95);
const npcs=[enemy,buddy,friend];
const labels=[];
function addLabel(text,obj,color='#ffffff'){
 const div=document.createElement('div');div.textContent=text;div.style.cssText=`position:fixed;color:${color};font-size:11px;font-weight:900;text-shadow:0 2px 5px #000;pointer-events:none;transform:translate(-50%,-100%);z-index:3;white-space:nowrap`;
 document.body.appendChild(div);labels.push({div,obj});
}
addLabel('RIVAL',enemy,'#fecaca');addLabel('HABITANT',buddy,'#bbf7d0');addLabel('RENCONTRE',friend,'#fbcfe8');
// Une ville plus vivante : habitants originaux qui se promènent et peuvent discuter.
const citizens=[];
const citizenColors=['green','red','blue','green','red','blue'];
for(let i=0;i<18;i++){
 const n=makeCharacter(false,citizenColors[i%citizenColors.length]);
 const side=i%2===0?-1:1;
 n.position.set(side*(8.5+(i%3)*1.5),0,-23+Math.floor(i/2)*7.2);
 n.scale.setScalar(.78+(i%4)*.055);
 n.userData.isCitizen=true;
 n.userData.name=['Alex','Maya','Jordan','Sam','Riley','Chris','Taylor','Noah','Lina','Amir','Zoé','Milo','Nina','Ethan','Inès','Léo','Sarah','Adam'][i];
 n.userData.mood=['sympa','pressé','méfiant','joyeux'][i%4];
 n.userData.goal=new THREE.Vector3(n.position.x+(Math.random()-.5)*8,0,n.position.z+(Math.random()-.5)*9);
 n.userData.chatCooldown=0;
 citizens.push(n);
 addLabel(n.userData.name.toUpperCase(),n,'#dbeafe');
}


const joyBase=document.getElementById('stickBase'), stick=document.getElementById('stick');
let joy={x:0,y:0},joyPointer=null;
function setJoy(e){const r=joyBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=42;const len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max;}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;}
joyBase.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joyBase.setPointerCapture(e.pointerId);setJoy(e);});
joyBase.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)setJoy(e);});
function resetJoy(){joy={x:0,y:0};joyPointer=null;stick.style.transform='translate(0,0)';}
joyBase.addEventListener('pointerup',resetJoy);joyBase.addEventListener('pointercancel',resetJoy);

let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')jump();if(e.key.toLowerCase()==='j')punch();if(e.key.toLowerCase()==='k')grab();if(e.key.toLowerCase()==='e')talkToNearest();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let energy=100,rep=0, messageTimer=0, jumping=0, attackCooldown=0, grappleCooldown=0, enemyRespawn=0;
const msg=document.getElementById('message');
function say(t){msg.textContent=t;msg.style.opacity=1;messageTimer=2.2;}
function talkToNearest(){
 let target=null,best=4.2;
 [...citizens,buddy,friend,enemy].forEach(n=>{const d=distance(player,n);if(d<best){best=d;target=n;}});
 if(!target){say('Approche-toi d’un habitant pour lui parler.');return;}
 if(target===enemy){say('Rival : « Tu cherches les problèmes ? Garde tes distances. »');rep=Math.max(0,rep);return;}
 const name=target.userData.name|| (target===buddy?'Marcus':'Dylan');
 const lines={
  sympa:[`« Salut ! Moi c’est ${name}. Tu viens d’arriver dans le quartier ? »`,`« La ville est grande. Tu devrais passer au gym ou au café ! »`,`« Ça fait plaisir de voir un nouveau visage. Tu fais quoi dans le coin ? »`],
  pressé:[`« Désolé, ${name}, je dois y aller. À plus !`,`« Pas maintenant, je suis en retard ! »`],
  méfiant:[`« On se connaît ? Je préfère savoir à qui j’ai affaire. »`,`« J’ai entendu parler de toi… reste tranquille et tout ira bien. »`],
  joyeux:[`« Hé ! Bienvenue dans le quartier ! Tu veux découvrir les bons endroits ? »`,`« Aujourd’hui, c’est une bonne journée ! Profite de la ville ! »`]
 };
 const mood=target.userData.mood||'sympa';
 say(`${name} : ${lines[mood][Math.floor(Math.random()*lines[mood].length)]}`);
 if(mood==='sympa'||mood==='joyeux')rep+=1;
 updateStats();
}
document.getElementById('talk').addEventListener('pointerdown',e=>{e.preventDefault();talkToNearest();});


function openNearbyShop(){
 let best=null,dist=9;
 for(const d of destinations){const dd=Math.hypot(player.position.x-d.x,player.position.z-d.z);if(dd<dist){best=d;dist=dd;}}
 if(!best){say('Approche-toi d’un magasin, du club, de la salle ou de la plage.');return;}
 const title=document.getElementById('shopTitle'),desc=document.getElementById('shopDesc'),items=document.getElementById('shopItems');
 title.textContent=best.name;desc.textContent=best.desc;items.innerHTML='';
 let offers=[];
 if(best.type==='grocery'||best.type==='cafe') offers=[['Acheter un snack — 15 $','Récupère 20 énergie',15,()=>energy=Math.min(100,energy+20)],['Acheter une boisson — 10 $','Récupère 10 énergie',10,()=>energy=Math.min(100,energy+10)]];
 else if(best.type==='clothes') offers=[['Tenue urbaine — 60 $','Une tenue stylée (prototype)',60,()=>say('Nouvelle tenue débloquée ! (visuel à ajouter)')],['Veste premium — 90 $','Un look plus imposant',90,()=>say('Veste premium débloquée ! (visuel à ajouter)')]];
 else if(best.type==='gear') offers=[['Gants de combat — 40 $','Équipement fictif : coups plus puissants bientôt',40,()=>say('Gants achetés ! Amélioration visuelle à venir.')],['Bâton d’entraînement — 50 $','Objet de jeu fictif',50,()=>say('Objet acheté ! Système d’équipement à développer.')]];
 else if(best.type==='gym') offers=[['Séance d’entraînement — 25 $','Récupère 30 énergie',25,()=>energy=Math.min(100,energy+30)],['Entraînement de réputation — 35 $','Gagne 2 réputation',35,()=>rep+=2]];
 else if(best.type==='club') offers=[['Entrée au club — 20 $','Ambiance et rencontres (contenu adulte non explicite)',20,()=>{rep+=1;say('Tu entres dans le club. La musique résonne !');}]];
 else offers=[['Pause à la plage — gratuit','Récupère 15 énergie',0,()=>energy=Math.min(100,energy+15)]];
 for(const [label,effect,cost,fn] of offers){const b=document.createElement('button');b.className='shopItem';b.textContent=label+' · '+effect;b.onclick=()=>{if(cash<cost){say('Tu n’as pas assez d’argent.');return;}cash-=cost;fn();document.getElementById('cash').textContent=cash;updateStats();};items.appendChild(b);}
 document.getElementById('shopPanel').style.display='block';
}
document.getElementById('interact').addEventListener('pointerdown',e=>{e.preventDefault();openNearbyShop();});
document.getElementById('closeShop').addEventListener('pointerdown',e=>{e.preventDefault();document.getElementById('shopPanel').style.display='none';});
function updateStats(){document.getElementById('energy').textContent=Math.max(0,Math.round(energy));document.getElementById('rep').textContent=rep;document.getElementById('enemyHealth').textContent=Math.max(0,Math.round(enemy.userData.health));}
function distance(a,b){return a.position.distanceTo(b.position);}
function face(from,to){const dx=to.position.x-from.position.x,dz=to.position.z-from.position.z;from.rotation.y=Math.atan2(dx,dz);}
function punch(){
 if(attackCooldown>0||energy<5)return;
 attackCooldown=.55;energy-=5;player.userData.attack=.32;player.userData.armR.rotation.x=-1.8;
 if(distance(player,enemy)<2.4 && enemy.userData.health>0){
  enemy.userData.health-=12;enemy.userData.stun=.35;enemy.position.add(new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y)).multiplyScalar(.65));rep+=1;
  say('BAM ! Le rival perd 12 points de vie.');
 } else say('Tu frappes dans le vide ! Approche-toi du rival.');
 updateStats();
}
function grab(){
 if(grappleCooldown>0||energy<12)return;
 grappleCooldown=1.15;energy-=12;player.userData.attack=.48;player.userData.armL.rotation.x=-1.6;
 if(distance(player,enemy)<2.6&&enemy.userData.health>0){
  enemy.userData.health-=23;enemy.userData.stun=.65;
  const dir=new THREE.Vector3(enemy.position.x-player.position.x,0,enemy.position.z-player.position.z).normalize();
  enemy.position.add(dir.multiplyScalar(1.65));enemy.rotation.x=-.5;rep+=3;
  say('PROJECTION ! Le rival est repoussé.');
 }else say('Personne à saisir ! Rapproche-toi du rival.');
 updateStats();
}
function jump(){if(jumping<=0){jumping=.55;player.userData.jumpV=5.4;}}
document.getElementById('punch').addEventListener('pointerdown',e=>{e.preventDefault();punch()});
document.getElementById('grab').addEventListener('pointerdown',e=>{e.preventDefault();grab()});
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.getElementById('reset').addEventListener('click',()=>{player.position.set(0,0,9);player.rotation.set(0,0,0);enemy.position.set(2.7,0,3);enemy.userData.health=100;enemy.userData.stun=0;energy=100;rep=0;cash=250;document.getElementById('cash').textContent=cash;say('Nouvelle partie ! Explore la ville et parle aux habitants.');updateStats();});

const clock=new THREE.Clock();
const cameraTarget=new THREE.Vector3();
const forward=new THREE.Vector3(), right=new THREE.Vector3();
let playerY=0, walkPhase=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 attackCooldown=Math.max(0,attackCooldown-dt);grappleCooldown=Math.max(0,grappleCooldown-dt);
 if(messageTimer>0){messageTimer-=dt;if(messageTimer<=0)msg.style.opacity=0;}
 energy=Math.min(100,energy+dt*2.3);
 const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.q||keys.arrowleft?1:0);
 const kz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.z||keys.arrowup?1:0);
 let mx=joy.x+kx,my=joy.y+kz;
 const mag=Math.hypot(mx,my);if(mag>1){mx/=mag;my/=mag;}
 // camera-relative movement
 // Direction cohérente avec l'écran : pousser le joystick vers le HAUT fait avancer.
 camera.getWorldDirection(forward);
 forward.y=0;
 if(forward.lengthSq()<0.001) forward.set(0,0,-1);
 forward.normalize();
 right.set(-forward.z,0,forward.x).normalize();
 const move=new THREE.Vector3().addScaledVector(right,mx).addScaledVector(forward,-my);
 if(move.lengthSq()>.02){
   move.normalize();player.position.addScaledVector(move,dt*6.0);
   player.rotation.y=Math.atan2(move.x,move.z);walkPhase+=dt*10;
   player.userData.legL.rotation.x=Math.sin(walkPhase)*.65;player.userData.legR.rotation.x=-Math.sin(walkPhase)*.65;
   player.userData.armL.rotation.x=-Math.sin(walkPhase)*.45;player.userData.armR.rotation.x=Math.sin(walkPhase)*.45;
 }else{
   player.userData.legL.rotation.x*=.8;player.userData.legR.rotation.x*=.8;
   player.userData.armL.rotation.x*=.8; if(attackCooldown<=0)player.userData.armR.rotation.x*=.8;
 }
 if(jumping>0){jumping-=dt;playerY+=player.userData.jumpV*dt;player.userData.jumpV-=14*dt;if(playerY<0){playerY=0;jumping=0;}}
 player.position.y=playerY;
 // keep within prototype block
 player.position.x=THREE.MathUtils.clamp(player.position.x,-78,78);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-78,78);
 // Rival AI
 if(enemy.userData.health>0){
   enemy.userData.stun=Math.max(0,enemy.userData.stun-dt);
   const d=distance(enemy,player);
   if(enemy.userData.stun<=0){
    if(d>1.65&&d<18){const v=player.position.clone().sub(enemy.position);v.y=0;v.normalize();enemy.position.addScaledVector(v,dt*1.65);face(enemy,player);}
    else if(d<=1.65){face(enemy,player);enemy.userData.armR.rotation.x=-.7;if(Math.random()<dt*.45){energy=Math.max(0,energy-3);say('Le rival te bouscule !');}}
   }
 } else if(enemyRespawn<=0){enemyRespawn=4;say('Rival vaincu ! Tu gagnes en réputation.');}
 if(enemyRespawn>0){enemyRespawn-=dt;if(enemyRespawn<=0){enemy.position.set(2.7,0,3);enemy.userData.health=100;enemy.rotation.y=Math.PI;enemyRespawn=0;}}
 // ambient NPC movement
 [buddy,friend].forEach((n,i)=>{n.userData.walk+=dt;if(n.userData.stun<=0){n.position.x+=(Math.sin(n.userData.walk*.5+i)*.25)*dt;n.position.z+=(Math.cos(n.userData.walk*.4+i)*.22)*dt;}});
 citizens.forEach((n,i)=>{
   n.userData.walk+=dt;
   const to=n.userData.goal.clone().sub(n.position);to.y=0;
   if(to.length()<1.1 || Math.random()<dt*.018){
     n.userData.goal.set(THREE.MathUtils.clamp(n.position.x+(Math.random()-.5)*12,-12,12),0,THREE.MathUtils.clamp(n.position.z+(Math.random()-.5)*12,-29,47));
   }else{
     to.normalize();n.position.addScaledVector(to,dt*(.45+(i%3)*.08));face(n,{position:n.userData.goal});
     n.userData.legL.rotation.x=Math.sin(n.userData.walk*5)*.28;
     n.userData.legR.rotation.x=-Math.sin(n.userData.walk*5)*.28;
   }
 });

 // camera follow
 const desired=new THREE.Vector3(player.position.x,player.position.y+5.1,player.position.z+9.5);
 camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1.25,player.position.z);
 // labels
 labels.forEach(({div,obj})=>{const p=obj.position.clone();p.y+=2.8;p.project(camera);div.style.left=((p.x*.5+.5)*innerWidth)+'px';div.style.top=((-p.y*.5+.5)*innerHeight)+'px';div.style.display=p.z<1?'block':'none';});
 // subtle ocean shimmer
 ocean.color.setHSL(.53,.52,.48+Math.sin(performance.now()*.0004)*.025);
 updateStats();
 renderer.render(scene,camera);
}
camera.position.set(0,6,18);camera.lookAt(0,1,9);
say('Bienvenue ! Utilise le joystick pour bouger.');animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));});
</script>
